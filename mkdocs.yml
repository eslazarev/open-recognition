site_name: open-recognition
site_description: Self-hosted, boto3-compatible AWS Rekognition Faces API — YuNet + SFace + pgvector
site_url: https://eslazarev.github.io/open-recognition/
repo_url: https://github.com/eslazarev/open-recognition
repo_name: eslazarev/open-recognition
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

not_in_nav: |
  /img/faces/CREDITS.md

plugins:
  - search
  - swagger-ui-tag

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - API reference: api.md
  - Operations: operations.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - Performance: performance.md
  - Security: security.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eslazarev/open-recognition
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/eslazarev/open-recognition
