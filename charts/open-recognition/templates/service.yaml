apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-recognition.fullname" . }}
  labels:
    {{- include "open-recognition.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default "http" }}
      protocol: TCP
  selector:
    {{- include "open-recognition.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
